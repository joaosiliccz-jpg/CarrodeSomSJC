<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Carro de Som</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f2937;background:#dfe6ea}
#clip{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#map{position:absolute;will-change:transform}

#topo{position:fixed;top:10px;left:10px;right:10px;z-index:1000;display:flex;gap:6px;background:rgba(255,255,255,.96);padding:8px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#areaSel{flex:1;min-width:0;padding:10px;border-radius:8px;border:1px solid #d1d5db;font-size:15px;background:#fff}
#areaSel:disabled{background:#f3f4f6;color:#6b7280}
.sq{width:44px;height:44px;flex:0 0 44px;border:none;border-radius:8px;background:#f3f4f6;font-size:19px;cursor:pointer}

#side{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:1000}
.round{width:48px;height:48px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1f2937;padding:0}
.round.active{background:#fcd34d}
.play{width:64px;height:64px;background:#16a34a;color:#fff;font-size:26px}
.stop{background:#dc2626;color:#fff}
.speedo{width:72px;height:72px;flex-direction:column;background:#111827;color:#fff;cursor:default;line-height:1}
.speedo b{font-size:24px}
.speedo span{font-size:10px;opacity:.8;margin-top:2px}

#tinfo{position:fixed;left:10px;top:70px;z-index:1000;display:none;gap:10px;background:rgba(17,24,39,.9);color:#fff;padding:8px 12px;border-radius:10px;font-size:14px;font-variant-numeric:tabular-nums}

#popup{position:fixed;right:74px;top:50%;transform:translateY(-50%);width:230px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;z-index:1500}
#popup b{display:block;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;padding:10px;margin-bottom:6px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;font-size:14px;cursor:pointer}
.opt.on{background:#fef3c7;border-color:#f59e0b;font-weight:600}

#credit{position:fixed;left:4px;bottom:2px;font-size:10px;background:rgba(255,255,255,.75);padding:1px 4px;border-radius:4px;z-index:900}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;z-index:3000;max-width:90%;text-align:center;pointer-events:none}

#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:4000;padding:14px}
.modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:480px;max-height:88vh;overflow:auto}
.modal h2{margin:0 0 12px;font-size:20px}
.modal table{width:100%;border-collapse:collapse;font-size:14px}
.modal td{padding:7px 4px;border-bottom:1px solid #eee}
.modal td:first-child{font-weight:600;width:44%}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.item small{color:#6b7280}
.acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn-pri,.btn-sec,.btn-danger{padding:10px 14px;border-radius:8px;border:none;font-size:14px;cursor:pointer;font-weight:600}
.btn-pri{background:#16a34a;color:#fff}
.btn-sec{background:#e5e7eb;color:#1f2937}
.btn-danger{background:#dc2626;color:#fff}

body.immersive #topo,body.immersive #tinfo,body.immersive #credit{display:none}
body.immersive #side .play,body.immersive #side .speedo{display:none}
/* camadas vetoriais (MapLibre) não devem capturar gestos: quem trata os gestos é o #clip */
#map .maplibregl-map,#map canvas{pointer-events:none}
</style>
</head>
<body>

<div id="clip"><div id="map"></div></div>

<div id="topo">
  <select id="areaSel" disabled><option value="">Carregue um KML…</option></select>
  <button class="sq" id="btnKml" title="Carregar KML">📁</button>
  <button class="sq" id="btnHist" title="Histórico">📋</button>
  <button class="sq" id="btnLimpar" title="Limpar tudo">🗑</button>
  <input type="file" id="fileKml" accept=".kml,application/vnd.google-earth.kml+xml" hidden>
</div>

<div id="tinfo"><span id="tVal">00:00:00</span><span id="kmVal">0.00 km</span></div>

<div id="side">
  <button class="round" id="bFull" title="Tela cheia">⛶</button>
  <button class="round" id="bCentro" title="Centralizar">⌖</button>
  <button class="round" id="bCam" title="Camadas">🗺</button>
  <button class="round" id="bTransp" title="Transparência">◐</button>
  <div class="round speedo" title="Velocidade"><b id="spdVal">0</b><span>km/h</span></div>
  <button class="round play" id="bPlay" title="Iniciar">▶</button>
  <button class="round stop" id="bStop" title="Finalizar atividade" style="display:none">■</button>
</div>

<div id="popup"></div>
<div id="credit">© OpenStreetMap</div>
<div id="toast"></div>
<div id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
function toast(msg, ms = 3000){
  const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, ms);
}
const fmtDur = ms => {
  const s = Math.floor(ms / 1000);
  return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(v => String(v).padStart(2, '0')).join(':');
};
const fmtDate = t => new Date(t).toLocaleString('pt-BR');
function dist(a, b){ // metros (haversine), a/b = [lat,lng]
  const R = 6371000, r = d => d * Math.PI / 180;
  const dLat = r(b[0] - a[0]), dLng = r(b[1] - a[1]);
  const x = Math.sin(dLat/2)**2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b){
  const r = d => d * Math.PI / 180, dLng = r(b[1] - a[1]);
  const y = Math.sin(dLng) * Math.cos(r(b[0]));
  const x = Math.cos(r(a[0])) * Math.sin(r(b[0])) - Math.sin(r(a[0])) * Math.cos(r(b[0])) * Math.cos(dLng);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
const wrapDiff = a => ((a + 540) % 360) - 180;

/* ================= IndexedDB (armazenamento persistente) ================= */
let dbPromise;
function openDB(){
  if(!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('carroDeSomDB', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('atividades', {keyPath:'id'}); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function tx(store, mode, fn){
  const d = await openDB();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k));
const kvDel = k => tx('kv', 'readwrite', s => s.delete(k));
const actPut = a => tx('atividades', 'readwrite', s => s.put(a));
const actAll = () => tx('atividades', 'readonly', s => s.getAll());
const actClear = () => tx('atividades', 'readwrite', s => s.clear());

/* ================= mapa ================= */
const BASES = {
  // Camadas sem chave de API (os servidores de tiles do OSM e os basemaps da CARTO agora exigem chave)
  'Mapa (ruas)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom:19}),
  'Satélite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19}),
  'Relevo': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom:19}),
  'Escuro': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {maxZoom:16}),
  // Mapa topográfico com dados do OSM (Openmaps.fr, sem chave). Uso não comercial, sujeito à política do serviço.
  'Topo OSM (Openmaps)': L.tileLayer('https://tile.openmaps.fr/opentopomap/{z}/{x}/{y}.png', {maxZoom:17})
};
const CREDITS = {
  'Mapa (ruas)': 'Esri, HERE, OpenStreetMap contributors',
  'Satélite': 'Imagens © Esri',
  'Relevo': 'Esri, USGS, OpenStreetMap contributors',
  'Escuro': 'Esri, HERE',
  'Topo OSM (Openmaps)': '© OpenStreetMap contributors · OpenTopoMap · Openmaps.fr'
};
// Mapas de ruas vetoriais atuais (OpenFreeMap, sem chave de API, dados do OpenStreetMap).
// Só são adicionados se a biblioteca MapLibre carregar; as demais camadas continuam funcionando.
if(window.L && L.maplibreGL){
  BASES['Ruas (OpenFreeMap)'] = L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty'});
  BASES['Claro (OpenFreeMap)'] = L.maplibreGL({style:'https://tiles.openfreemap.org/styles/positron'});
  CREDITS['Ruas (OpenFreeMap)'] = '© OpenFreeMap · © OpenMapTiles · © OpenStreetMap contributors';
  CREDITS['Claro (OpenFreeMap)'] = '© OpenFreeMap · © OpenMapTiles · © OpenStreetMap contributors';
}

const state = {
  base: 'Mapa (ruas)', transp: 40,
  areas: [], layers: {}, selectedId: null,
  session: null, follow: false,
  carPos: null, targetPos: null, carMarker: null, carWrap: null,
  headingTarget: null, headingCur: 0, rotCur: 0,
  gpsLast: null, trail: null,
  manualRot: 0, half: 0, idleTimer: null
};

const mapEl = $('#map');
// Os gestos (arrastar, pinça, rotação) são tratados manualmente para funcionar com o mapa girado
const map = L.map('map', {zoomControl:false, attributionControl:false, zoomSnap:0.25,
  dragging:false, touchZoom:false, scrollWheelZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false
}).setView([-15.8, -47.9], 4);
BASES[state.base].addTo(map);
const allGroup = L.layerGroup().addTo(map);
state.trail = L.polyline([], {color:'#000', weight:5, lineCap:'round', lineJoin:'round', interactive:false}).addTo(map);

// O mapa é maior que a tela (diagonal) para que a rotação nunca mostre bordas vazias
function layoutMap(){
  const d = Math.hypot(innerWidth, innerHeight);
  state.half = d;
  Object.assign(mapEl.style, {
    width: 2*d + 'px', height: 2*d + 'px',
    left: (innerWidth/2 - d) + 'px', top: (innerHeight/2 - d) + 'px'
  });
  map.invalidateSize();
}
layoutMap();
window.addEventListener('resize', layoutMap);
map.on('click', closePopup);

function setFollow(v){ state.follow = v; $('#bCentro').classList.toggle('active', v); }

// Tocar ou gesticular no mapa sai do modo navegação (mantendo a rotação atual, como no Google Maps)
function exitFollow(){
  if(state.follow){ setFollow(false); state.manualRot = state.rotCur; }
  clearTimeout(state.idleTimer);
}

// Durante uma atividade, o mapa volta a seguir o carro sozinho após 8 s sem toques
function scheduleRefollow(){
  clearTimeout(state.idleTimer);
  if(state.session && state.session.running){
    state.idleTimer = setTimeout(() => { if(state.carPos && !state.follow) centralizar(); }, 8000);
  }
}

function centralizar(){
  if(!state.carPos){ toast('Aguardando sinal do GPS…'); return; }
  clearTimeout(state.idleTimer);
  setFollow(true);
  map.setView(state.carPos, Math.max(map.getZoom(), 17), {animate:true});
}

/* ---- gestos: arrastar, pinça para zoom, dois dedos para girar ---- */
const clipEl = $('#clip');
const ptrs = new Map();
let gest = null;
const angleOf = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
const dist2 = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
const midOf = (a, b) => ({x:(a.x + b.x)/2, y:(a.y + b.y)/2});

// Converte um ponto da tela para o ponto do contêiner do Leaflet, considerando a rotação
function screenToContainer(x, y){
  const t = state.rotCur * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
  const dx = x - innerWidth/2, dy = y - innerHeight/2;
  return L.point(state.half + dx*c + dy*s, state.half - dx*s + dy*c);
}
// Converte um deslocamento da tela para o sistema do mapa (sem rotação)
function screenDeltaToMap(dx, dy){
  const t = state.rotCur * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
  return [dx*c + dy*s, -dx*s + dy*c];
}

function startGesture(){
  const pts = [...ptrs.values()];
  if(pts.length === 1) gest = {mode:'pan', x:pts[0].x, y:pts[0].y};
  else if(pts.length >= 2){
    const [a, b] = pts;
    gest = {mode:'pinch', ang:angleOf(a, b), dist:dist2(a, b), mid:midOf(a, b)};
  }
}

clipEl.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  exitFollow();
  startGesture();
});

window.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(!gest) return;
  const pts = [...ptrs.values()];

  if(gest.mode === 'pan' && pts.length === 1){
    const dx = e.clientX - gest.x, dy = e.clientY - gest.y;
    gest.x = e.clientX; gest.y = e.clientY;
    const [mx, my] = screenDeltaToMap(dx, dy);
    map.panBy([-mx, -my], {animate:false});
  }
  else if(gest.mode === 'pinch' && pts.length >= 2){
    const [a, b] = pts;
    const ang = angleOf(a, b), d = dist2(a, b), mid = midOf(a, b);

    // girar com dois dedos
    state.rotCur += wrapDiff(ang - gest.ang);
    state.manualRot = state.rotCur;

    // deslocar junto com o meio dos dedos
    const [pmx, pmy] = screenDeltaToMap(mid.x - gest.mid.x, mid.y - gest.mid.y);
    map.panBy([-pmx, -pmy], {animate:false});

    // pinça para zoom, em torno do meio dos dedos
    if(d > 0 && gest.dist > 0){
      map.setZoomAround(screenToContainer(mid.x, mid.y), map.getZoom() + Math.log2(d / gest.dist), {animate:false});
    }
    gest.ang = ang; gest.dist = d; gest.mid = mid;
  }
});

function endPointer(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size === 0){ gest = null; scheduleRefollow(); }
  else startGesture();
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

// Zoom com a roda do mouse e duplo toque
clipEl.addEventListener('wheel', e => {
  e.preventDefault();
  map.setZoomAround(screenToContainer(e.clientX, e.clientY), map.getZoom() + (e.deltaY < 0 ? 0.5 : -0.5), {animate:false});
}, {passive:false});
clipEl.addEventListener('dblclick', e => {
  map.setZoomAround(screenToContainer(e.clientX, e.clientY), map.getZoom() + 1, {animate:false});
});
clipEl.addEventListener('click', closePopup);

/* ================= áreas (KML) ================= */
function ringFrom(el){
  const c = el.getElementsByTagName('coordinates')[0];
  if(!c) return [];
  return c.textContent.trim().split(/\s+/).map(t => t.split(',')).filter(p => p.length >= 2)
    .map(p => [parseFloat(p[1]), parseFloat(p[0])]).filter(p => !isNaN(p[0]) && !isNaN(p[1]));
}
function parseKML(text){
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  if(xml.getElementsByTagName('parsererror').length) throw new Error('Arquivo KML inválido.');
  const out = [];
  for(const pm of xml.getElementsByTagName('Placemark')){
    const name = (pm.getElementsByTagName('name')[0]?.textContent || 'Área').trim();
    for(const pg of pm.getElementsByTagName('Polygon')){
      const rings = [];
      const outer = pg.getElementsByTagName('outerBoundaryIs')[0];
      if(outer){ const c = ringFrom(outer); if(c.length > 2) rings.push(c); }
      for(const ib of pg.getElementsByTagName('innerBoundaryIs')){ const c = ringFrom(ib); if(c.length > 2) rings.push(c); }
      if(rings.length) out.push({id:'a'+out.length+'_'+Date.now(), name, kind:'poly', rings});
    }
    for(const ls of pm.getElementsByTagName('LineString')){
      const c = ringFrom(ls);
      if(c.length > 1) out.push({id:'a'+out.length+'_'+Date.now(), name, kind:'line', rings:[c]});
    }
  }
  return out;
}

const grayStyle = () => ({color:'#6b7280', weight:1.5, fillColor:'#9ca3af', fillOpacity:0.08});
const yellowStyle = () => ({color:'#b45309', weight:2, fillColor:'#facc15', fillOpacity: 1 - state.transp/100});

function drawAreas(){
  allGroup.clearLayers(); state.layers = {};
  state.areas.forEach(a => {
    const l = a.kind === 'line' ? L.polyline(a.rings, grayStyle()) : L.polygon(a.rings, grayStyle());
    l.addTo(allGroup); state.layers[a.id] = l;
  });
  if(state.selectedId && state.layers[state.selectedId]) state.layers[state.selectedId].setStyle(yellowStyle());
}
function rebuildSelect(){
  const sel = $('#areaSel');
  const sorted = [...state.areas].sort((a,b) => a.name.localeCompare(b.name, 'pt-BR', {numeric:true}));
  sel.innerHTML = '<option value="">Selecione uma área…</option>' +
    sorted.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
  sel.disabled = !!state.session;
  sel.value = state.selectedId || '';
}
function restyleSelected(){
  if(state.selectedId && state.layers[state.selectedId]) state.layers[state.selectedId].setStyle(yellowStyle());
}
function selectArea(id){
  state.selectedId = id || null;
  state.areas.forEach(a => { const l = state.layers[a.id]; if(l) l.setStyle(a.id === id ? yellowStyle() : grayStyle()); });
  if(id && state.layers[id]){
    setFollow(false);
    map.fitBounds(state.layers[id].getBounds(), {padding:[40,40]});
  }
  kvSet('selectedArea', id || null);
  $('#areaSel').value = id || '';
}
$('#areaSel').onchange = e => selectArea(e.target.value || null);

$('#btnKml').onclick = () => $('#fileKml').click();
$('#fileKml').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    if(state.session){ toast('Finalize a atividade antes de trocar as áreas.'); return; }
    const novas = parseKML(await f.text());
    if(!novas.length) throw new Error('Nenhuma área (polígono) encontrada no KML.');
    if(state.areas.length && !confirm(`Substituir as ${state.areas.length} áreas atuais por ${novas.length} do arquivo "${f.name}"?`)) return;
    state.areas = novas; state.selectedId = null;
    await kvSet('areas', {items:novas, fileName:f.name});
    await kvSet('selectedArea', null);
    drawAreas(); rebuildSelect();
    toast(`${novas.length} áreas carregadas.`);
  }catch(err){ toast(err.message, 4000); }
  finally{ e.target.value = ''; }
};

/* ================= GPS, carro e rotação ================= */
const CAR_SVG = `<svg width="44" height="44" viewBox="-22 -22 44 44">
  <rect x="-9" y="-14" width="18" height="28" rx="5" fill="#2563eb" stroke="#fff" stroke-width="2"/>
  <rect x="-7" y="-8" width="14" height="6" rx="2" fill="#bfdbfe"/>
  <rect x="-7" y="4" width="14" height="6" rx="2" fill="#93c5fd"/>
  <polygon points="0,-21 -6,-13 6,-13" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
</svg>`;

function onFix(pos){
  const {latitude:lat, longitude:lng, accuracy:acc, speed, heading} = pos.coords;
  const now = Date.now(), ll = [lat, lng], prev = state.gpsLast;
  const moved = prev ? dist(prev.ll, ll) : 0;

  let kmh = 0;
  if(speed != null && !isNaN(speed) && speed >= 0) kmh = speed * 3.6;
  else if(prev && now > prev.t) kmh = (moved / ((now - prev.t) / 1000)) * 3.6;
  if(kmh < 1.5) kmh = 0;

  if(heading != null && !isNaN(heading) && kmh > 2) state.headingTarget = heading;
  else if(prev && moved >= 5) state.headingTarget = bearing(prev.ll, ll);
  state.gpsLast = {ll, t:now};
  $('#spdVal').textContent = Math.round(kmh);
  state.targetPos = ll;

  if(!state.carMarker){
    state.carPos = [lat, lng];
    state.carMarker = L.marker(ll, {
      icon: L.divIcon({className:'car-icon', html:`<div class="car-wrap">${CAR_SVG}</div>`, iconSize:[44,44], iconAnchor:[22,22]}),
      interactive:false, zIndexOffset:1000
    }).addTo(map);
    state.carWrap = state.carMarker.getElement().querySelector('.car-wrap');
    map.setView(ll, 17, {animate:false});
    setFollow(true);
  }

  const s = state.session;
  if(s && s.running && acc <= 50){
    const last = s.path[s.path.length - 1];
    if(!last) s.path.push([lat, lng, now]);
    else {
      const d = dist([last[0], last[1]], ll);
      if(d >= (kmh > 1 ? 3 : 10)){ s.distance += d; s.path.push([lat, lng, now]); }
    }
    if(kmh > s.maxKmh) s.maxKmh = kmh;
    state.trail.setLatLngs(s.path.map(p => [p[0], p[1]]));
    persistSession(false);
  }
}

// Animação contínua: suaviza posição, direção do carro e rotação do mapa
function frame(){
  if(state.carMarker && state.targetPos){
    const c = state.carPos;
    c[0] += (state.targetPos[0] - c[0]) * 0.25;
    c[1] += (state.targetPos[1] - c[1]) * 0.25;
    state.carMarker.setLatLng(c);
    if(state.follow){
      // Carro aparece na parte de baixo da tela, com a visão à frente dele (estilo navegação)
      const z = map.getZoom();
      let p = map.project(c, z);
      if(state.headingTarget != null){
        const h = state.headingCur * Math.PI / 180, off = innerHeight * 0.2;
        p = p.add(L.point(off * Math.sin(h), -off * Math.cos(h)));
      }
      map.setView(map.unproject(p, z), z, {animate:false});
    }
  }
  if(state.headingTarget != null) state.headingCur += wrapDiff(state.headingTarget - state.headingCur) * 0.15;
  if(state.carWrap) state.carWrap.style.transform = `rotate(${state.headingCur}deg)`;

  // Com o modo navegação ativo, o mapa gira para que a direção do carro fique sempre "para cima"
  const goal = state.follow ? (state.headingTarget != null ? -state.headingCur : 0) : state.manualRot;
  state.rotCur += wrapDiff(goal - state.rotCur) * 0.12;
  mapEl.style.transform = `rotate(${state.rotCur}deg)`;
  requestAnimationFrame(frame);
}

let gpsDeniedShown = false;
function gpsError(e){
  if(e.code !== 1){ toast('GPS: ' + e.message, 5000); return; }
  if(gpsDeniedShown) return;
  gpsDeniedShown = true;
  const m = abrirModal(`<h2>Localização bloqueada</h2>
    <p>O navegador não permite usar o GPS deste site.</p>
    <p><b>Como liberar:</b></p>
    <ol>
      <li>Toque no cadeado ou no ícone de configurações ao lado do endereço.</li>
      <li>Em <b>Permissões</b>, ative <b>Localização</b>.</li>
      <li>Volte ao app e toque em "Tentar novamente".</li>
    </ol>
    <p><small>O GPS só funciona em endereços com HTTPS (https://).</small></p>
    <div class="acoes"><button class="btn-sec" id="gOk">Fechar</button><button class="btn-pri" id="gRetry">Tentar novamente</button></div>`);
  m.querySelector('#gOk').onclick = fecharModal;
  m.querySelector('#gRetry').onclick = () => {
    fecharModal();
    gpsDeniedShown = false;
    startGPS();
  };
}

function startGPS(){
  if(!navigator.geolocation){ toast('Este aparelho não possui GPS.', 5000); return; }
  navigator.geolocation.watchPosition(onFix, gpsError,
    {enableHighAccuracy:true, maximumAge:0, timeout:30000});
}

/* ================= atividade ================= */
function elapsed(s){ return s.accMs + (s.running ? Date.now() - s.lastResume : 0); }

let lastSave = 0;
function persistSession(force){
  if(!state.session) return;
  const now = Date.now();
  if(!force && now - lastSave < 10000) return;
  lastSave = now;
  kvSet('sessao', state.session);
}

function togglePlay(){
  if(state.session && state.session.running) return pauseSession();
  if(!state.selectedId){ toast('Selecione uma área antes de iniciar.'); return; }
  if(!state.carPos){ toast('Aguardando sinal do GPS…'); return; }
  if(!state.session){
    const a = state.areas.find(x => x.id === state.selectedId);
    state.session = {id:String(Date.now()), areaId:a.id, areaName:a.name, startedAt:Date.now(),
      accMs:0, lastResume:0, running:false, distance:0, path:[], maxKmh:0};
  }
  const s = state.session;
  s.running = true; s.lastResume = Date.now();
  lockScreen(true); persistSession(true); updateUI();
}
function pauseSession(){
  const s = state.session;
  s.accMs += Date.now() - s.lastResume;
  s.running = false; s.lastResume = 0;
  lockScreen(false); persistSession(true); updateUI();
}

async function finalizar(){
  if(!state.session) return;
  if(!confirm('Finalizar a atividade e gerar o relatório?')) return;
  if(state.session.running) pauseSession();
  const s = state.session;
  const km = s.distance / 1000;
  const hours = s.accMs / 3600000;
  const rec = {
    id:s.id, areaId:s.areaId, areaName:s.areaName, startedAt:s.startedAt, endedAt:Date.now(),
    tempoMs:s.accMs, km, avgKmh: hours > 0 ? km / hours : 0, maxKmh:s.maxKmh,
    path: s.path.map(p => [p[0], p[1]])
  };
  await actPut(rec);
  await kvDel('sessao');
  state.session = null;
  state.trail.setLatLngs([]);
  updateUI();
  showReport(rec);
}

function updateUI(){
  const s = state.session, running = !!(s && s.running);
  $('#bPlay').textContent = running ? '⏸' : '▶';
  $('#bPlay').title = running ? 'Pausar' : 'Iniciar';
  $('#bStop').style.display = s ? 'flex' : 'none';
  $('#tinfo').style.display = s ? 'flex' : 'none';
  $('#areaSel').disabled = !!s;
  $('#areaSel').value = state.selectedId || '';
  updateTimer();
}
function updateTimer(){
  const s = state.session; if(!s) return;
  $('#tVal').textContent = fmtDur(elapsed(s));
  $('#kmVal').textContent = (s.distance / 1000).toFixed(2) + ' km';
}

// Mantém a tela ligada durante a atividade
let wake = null;
async function lockScreen(on){
  try{
    if(on){ if(navigator.wakeLock && !wake) wake = await navigator.wakeLock.request('screen'); }
    else if(wake){ await wake.release(); wake = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if(document.hidden) persistSession(true);
  else if(state.session && state.session.running){ wake = null; lockScreen(true); }
});
window.addEventListener('pagehide', () => persistSession(true));

/* ================= relatório e PDF ================= */
function linhasRelatorio(r){
  return [
    ['Área', esc(r.areaName)], ['Início', fmtDate(r.startedAt)], ['Fim', fmtDate(r.endedAt)],
    ['Tempo de trajeto', fmtDur(r.tempoMs)], ['Km percorridos', r.km.toFixed(2) + ' km'],
    ['Velocidade média', r.avgKmh.toFixed(1) + ' km/h'], ['Velocidade máxima', r.maxKmh.toFixed(1) + ' km/h']
  ].map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}
function showReport(r){
  const m = abrirModal(`<h2>Relatório da atividade</h2><table>${linhasRelatorio(r)}</table>
    <div class="acoes"><button class="btn-pri" id="rPdf">Baixar PDF</button><button class="btn-sec" id="rOk">Fechar</button></div>`);
  m.querySelector('#rPdf').onclick = () => gerarPDF(r);
  m.querySelector('#rOk').onclick = fecharModal;
}

function desenharMapa(r){
  const area = state.areas.find(a => a.id === r.areaId);
  const pts = [];
  if(area) area.rings.forEach(ring => ring.forEach(p => pts.push(p)));
  (r.path || []).forEach(p => pts.push([p[0], p[1]]));
  if(!pts.length) return null;

  let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
  pts.forEach(([la, lo]) => {
    if(la < minLat) minLat = la; if(la > maxLat) maxLat = la;
    if(lo < minLng) minLng = lo; if(lo > maxLng) maxLng = lo;
  });
  const cos = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
  const W = 800, H = 600, pad = 30;
  const spanX = Math.max((maxLng - minLng) * cos, 1e-9), spanY = Math.max(maxLat - minLat, 1e-9);
  const s = Math.min((W - 2*pad) / spanX, (H - 2*pad) / spanY);
  const offX = (W - 2*pad - spanX*s) / 2, offY = (H - 2*pad - spanY*s) / 2;
  const X = lo => pad + offX + (lo - minLng) * cos * s;
  const Y = la => H - pad - offY - (la - minLat) * s;

  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  if(area){
    ctx.beginPath();
    area.rings.forEach(ring => {
      ring.forEach((p, i) => i ? ctx.lineTo(X(p[1]), Y(p[0])) : ctx.moveTo(X(p[1]), Y(p[0])));
      ctx.closePath();
    });
    ctx.fillStyle = 'rgba(250,204,21,0.6)'; ctx.fill('evenodd');
    ctx.strokeStyle = '#b45309'; ctx.lineWidth = 3; ctx.stroke();
  }
  if(r.path && r.path.length > 1){
    ctx.beginPath();
    r.path.forEach((p, i) => i ? ctx.lineTo(X(p[1]), Y(p[0])) : ctx.moveTo(X(p[1]), Y(p[0])));
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  }
  return c.toDataURL('image/png');
}

function gerarPDF(r){
  if(!window.jspdf){ toast('Biblioteca de PDF não carregou. Verifique a internet.', 4000); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18); doc.setFont(undefined, 'bold');
  doc.text('Relatório da Atividade', 14, 20);
  doc.setFontSize(11);
  let y = 34;
  [
    ['Área', r.areaName], ['Início', fmtDate(r.startedAt)], ['Fim', fmtDate(r.endedAt)],
    ['Tempo de trajeto', fmtDur(r.tempoMs)], ['Km percorridos', r.km.toFixed(2) + ' km'],
    ['Velocidade média', r.avgKmh.toFixed(1) + ' km/h'], ['Velocidade máxima', r.maxKmh.toFixed(1) + ' km/h']
  ].forEach(([k, v]) => {
    doc.setFont(undefined, 'bold'); doc.text(k + ':', 14, y);
    doc.setFont(undefined, 'normal'); doc.text(String(v), 70, y);
    y += 8;
  });
  const img = desenharMapa(r);
  if(img) doc.addImage(img, 'PNG', 14, y + 6, 180, 135);
  const nome = new Date(r.startedAt).toISOString().slice(0, 16).replace(/[:T]/g, '-');
  doc.save(`relatorio_${nome}.pdf`);
}

/* ================= histórico e limpeza ================= */
function abrirModal(html){
  $('#modal').innerHTML = html;
  $('#modalBg').style.display = 'flex';
  return $('#modal');
}
function fecharModal(){ $('#modalBg').style.display = 'none'; }
$('#modalBg').addEventListener('click', e => { if(e.target.id === 'modalBg') fecharModal(); });

async function abrirHistorico(){
  const lista = (await actAll()).sort((a, b) => b.startedAt - a.startedAt);
  const byId = {}; lista.forEach(r => byId[r.id] = r);
  const itens = lista.length
    ? lista.map(r => `<div class="item"><div><b>${esc(r.areaName)}</b><br>
        <small>${fmtDate(r.startedAt)} · ${fmtDur(r.tempoMs)} · ${r.km.toFixed(2)} km · ${r.avgKmh.toFixed(1)} km/h méd.</small></div>
        <button class="btn-sec" data-id="${esc(r.id)}">PDF</button></div>`).join('')
    : '<p>Nenhuma atividade salva.</p>';
  const m = abrirModal(`<h2>Histórico</h2>${itens}
    <div class="acoes"><button class="btn-danger" id="hLimpar">Limpar dados</button><button class="btn-sec" id="hOk">Fechar</button></div>`);
  m.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => gerarPDF(byId[b.dataset.id]));
  m.querySelector('#hOk').onclick = fecharModal;
  m.querySelector('#hLimpar').onclick = limparTudo;
}

async function limparTudo(){
  if(!confirm('ATENÇÃO: isso apagará todas as atividades salvas, as áreas do KML e a atividade em andamento. Esta ação não pode ser desfeita. Deseja continuar?')) return;
  await actClear();
  await kvDel('areas'); await kvDel('sessao'); await kvDel('selectedArea');
  state.areas = []; state.selectedId = null; state.session = null;
  state.trail.setLatLngs([]);
  drawAreas(); rebuildSelect(); updateUI();
  fecharModal();
  toast('Dados apagados.');
}
$('#btnHist').onclick = abrirHistorico;
$('#btnLimpar').onclick = limparTudo;

/* ================= camadas, transparência e tela cheia ================= */
let popKind = null;
function closePopup(){ popKind = null; $('#popup').style.display = 'none'; }
function openPopup(kind){
  if(popKind === kind){ closePopup(); return; }
  popKind = kind;
  const p = $('#popup'); p.style.display = 'block';
  if(kind === 'cam'){
    p.innerHTML = '<b>Camadas</b>' + Object.keys(BASES).map(n =>
      `<button class="opt ${n === state.base ? 'on' : ''}" data-b="${esc(n)}">${esc(n)}</button>`).join('');
    p.onclick = e => { const b = e.target.dataset.b; if(b) setBase(b); };
  } else {
    p.innerHTML = `<b>Transparência do amarelo: <span id="tpv">${state.transp}</span>%</b>
      <input type="range" min="0" max="90" step="5" value="${state.transp}" id="tsl" style="width:100%">`;
    p.onclick = null;
    $('#tsl').oninput = e => {
      state.transp = +e.target.value; $('#tpv').textContent = state.transp;
      restyleSelected(); kvSet('transp', state.transp);
    };
  }
}
function setBase(name){
  map.removeLayer(BASES[state.base]);
  state.base = name; BASES[name].addTo(map);
  $('#credit').textContent = CREDITS[name];
  kvSet('base', name); closePopup();
}
$('#bCam').onclick = () => openPopup('cam');
$('#bTransp').onclick = () => openPopup('transp');

function toggleImmersive(){
  document.body.classList.toggle('immersive');
  $('#bFull').classList.toggle('active', document.body.classList.contains('immersive'));
  setTimeout(() => map.invalidateSize(), 50);
}
function toggleFull(){
  if(document.fullscreenElement){ document.exitFullscreen?.(); return; }
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen().catch(toggleImmersive);
  else toggleImmersive();
}
document.addEventListener('fullscreenchange', () => {
  $('#bFull').classList.toggle('active', !!document.fullscreenElement);
  setTimeout(() => map.invalidateSize(), 100);
});
$('#bFull').onclick = toggleFull;

$('#bCentro').onclick = centralizar;
$('#bPlay').onclick = togglePlay;
$('#bStop').onclick = finalizar;

/* ================= inicialização ================= */
(async () => {
  try{ navigator.storage?.persist?.(); }catch(e){}

  state.transp = (await kvGet('transp')) ?? 40;
  const base = await kvGet('base');
  if(base && BASES[base] && base !== state.base){ map.removeLayer(BASES[state.base]); state.base = base; BASES[base].addTo(map); }
  $('#credit').textContent = CREDITS[state.base];

  const saved = await kvGet('areas');
  if(saved) state.areas = saved.items || [];
  drawAreas(); rebuildSelect();

  const sel = await kvGet('selectedArea');
  if(sel && state.areas.some(a => a.id === sel)) selectArea(sel);

  // Recupera atividade que não foi finalizada (ex.: app fechado no meio)
  const s = await kvGet('sessao');
  if(s){
    s.running = false; s.lastResume = 0;
    state.session = s;
    state.selectedId = s.areaId;
    state.trail.setLatLngs(s.path.map(p => [p[0], p[1]]));
    selectArea(s.areaId);
    toast('Atividade anterior restaurada (pausada). ▶ continua, ■ finaliza.', 6000);
  }
  updateUI();
  startGPS();
  setInterval(updateTimer, 1000);
  requestAnimationFrame(frame);
})();
</script>
